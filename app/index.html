<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>SayCAD</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { padding: 20px; box-sizing: border-box; max-width: 560px; margin: auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .muted { color: #919191; margin: 0 0 16px; }
      form { display: flex; gap: 8px; }
      input { flex: 1; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #555; background: #111; color: inherit; }
      button { font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 0; background: #3a3a3a; color: inherit; }
      form button { background: #2e7d32; }
      a { color: #8bc34a; }
      pre { white-space: pre-wrap; color: #919191; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">Starting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
